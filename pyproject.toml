[tool.poetry]
name = "blueprint"
version = "0.1.0"
description = "A library implement a variety of superconducting circuit models and the tools required to perform fast and detail simulations of their dynamics."
authors = ["Boris Varbanov <Boris.Mihailov.Varbanov@USherbrooke.ca>", "Élie Genois <Elie.Genois@USherbrooke.ca>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
setuptools = "^70.0.0"
cython = "^0.29.37"
pybind11 = "^2.11.1"
numpy = "^1.26.4"
scipy = "^1.12.0"
matplotlib = "^3.8.3"
wheel = "^0.42.0"
dynamiqs = {git = "https://github.com/dynamiqs/dynamiqs.git"}
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"

[tool.poetry.group.cpu]
optional = true

[tool.poetry.group.cpu.dependencies]
jax = {extras = ["cpu"], version = "^0.4.26"}

[tool.poetry.group.cuda]
optional = true

[tool.poetry.group.cuda.dependencies]
jax = {extras = ["cuda12"], version = "^0.4.26"}

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
ipykernel = {version = "^6.29.4"}
jupytext = {version = "^1.16.1"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
